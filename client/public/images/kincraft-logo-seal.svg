<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="KinCraft Heritage Artisan Collective Seal">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CB70"/>
      <stop offset="50%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#AC7720"/>
    </linearGradient>
    <linearGradient id="sealTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE6B54"/>
      <stop offset="100%" stop-color="#8F4633"/>
    </linearGradient>
    <path id="textCircleTop" d="M 32,100 A 68,68 0 0,1 168,100" fill="none"/>
    <path id="textCircleBottom" d="M 168,100 A 68,68 0 0,1 32,100" fill="none"/>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#20382E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Starburst / Sawtooth Heritage Rim -->
  <circle cx="100" cy="100" r="96" fill="#F7F2E8" stroke="url(#sealGold)" stroke-width="1.5" filter="url(#sealShadow)"/>
  <circle cx="100" cy="100" r="91" stroke="#20382E" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="100" cy="100" r="88" stroke="url(#sealGold)" stroke-width="1.8"/>

  <!-- Circular Curved Typography Around Seal -->
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="3.5" fill="#20382E">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      • KINCRAFT ARTISAN COLLECTIVE •
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.2" fill="#A65A45">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      AUTHENTIC LINEAGE • ESTD. INDIA
    </textPath>
  </text>

  <!-- Inner Medallion Border -->
  <circle cx="100" cy="100" r="54" fill="#20382E" stroke="url(#sealGold)" stroke-width="2"/>
  <circle cx="100" cy="100" r="51" stroke="url(#sealGold)" stroke-width="0.8" stroke-dasharray="1.5 3" stroke-opacity="0.8"/>

  <!-- Center Emblem (scale & position) -->
  <g transform="translate(100, 100) scale(0.95)">
    <!-- Cardinal Loops -->
    <path d="M 0 -7 C -14 -16, -18 -31, 0 -38 C 18 -31, 14 -16, 0 -7 Z" fill="#2F4F3E" stroke="url(#sealGold)" stroke-width="1.3"/>
    <path d="M 0 7 C -14 16, -18 31, 0 38 C 18 31, 14 16, 0 7 Z" fill="#2F4F3E" stroke="url(#sealGold)" stroke-width="1.3"/>
    <path d="M 7 0 C 16 -14, 31 -18, 38 0 C 31 18, 16 14, 7 0 Z" fill="#2F4F3E" stroke="url(#sealGold)" stroke-width="1.3"/>
    <path d="M -7 0 C -16 -14, -31 -18, -38 0 C -31 18, -16 14, -7 0 Z" fill="#2F4F3E" stroke="url(#sealGold)" stroke-width="1.3"/>

    <!-- Diagonal Loops -->
    <g transform="rotate(45)">
      <path d="M 0 -5.5 C -11 -13, -15 -25, 0 -31 C 15 -25, 11 -13, 0 -5.5 Z" fill="url(#sealTerracotta)" stroke="url(#sealGold)" stroke-width="1.1"/>
      <path d="M 0 5.5 C -11 13, -15 25, 0 31 C 15 25, 11 13, 0 5.5 Z" fill="url(#sealTerracotta)" stroke="url(#sealGold)" stroke-width="1.1"/>
      <path d="M 5.5 0 C 13 -11, 25 -15, 31 0 C 25 15, 13 11, 5.5 0 Z" fill="url(#sealTerracotta)" stroke="url(#sealGold)" stroke-width="1.1"/>
      <path d="M -5.5 0 C -13 -11, -25 -15, -31 0 C -25 15, -13 11, -5.5 0 Z" fill="url(#sealTerracotta)" stroke="url(#sealGold)" stroke-width="1.1"/>
    </g>

    <!-- Center Star & Spindle -->
    <circle cx="0" cy="0" r="10" fill="#20382E" stroke="url(#sealGold)" stroke-width="1.4"/>
    <path d="M 0 -8 L 2.4 -2.4 L 8 0 L 2.4 2.4 L 0 8 L -2.4 2.4 L -8 0 L -2.4 -2.4 Z" fill="url(#sealGold)"/>
    <circle cx="0" cy="0" r="2.2" fill="#FFFDF9"/>
  </g>
</svg>